[package]
name = "tauri-plugin-memokeep-workspace"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-memokeep-workspace"

[features]
smoke-test = []

[dependencies]
memokeep-storage = { path = "../memokeep-storage" }
rusqlite = "0.37"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
memokeep-desktop-services = { path = "../memokeep-desktop-services" }
tauri-plugin-dialog = "2"
base64 = "0.23"
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints]
workspace = true
