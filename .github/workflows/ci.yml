name: Community checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Verify Community source
        run: npm run verify:source
