name: Community checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust checks
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Verify Community source
        run: npm run verify:source
  desktop-tauri:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: npm run stage:community
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: npm run test:desktop
